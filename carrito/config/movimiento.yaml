# Movimiento del ROSCar: velocidades del planificador y parámetros del ejecutor.
# Lo lee carrito/granprix_carrito/configuracion.py (cargar_movimiento). Cualquier clave no listada aquí
# es un error: así un nombre mal escrito no se ignora en silencio.
#
# Origen de cada valor:  [reto] límite oficial, no se sube  |  [ref] referencia del HTML y de RC-1
#                        [propio] decisión nuestra, provisional  |  [medir] placeholder: medir en el robot
version: 1

velocidades:
  v_ref: 0.10    # [ref]  m/s de crucero en los tramos
  w_ref: 0.50    # [ref]  rad/s de crucero en los giros
  v_max: 0.20    # [reto] m/s. El cargador rechaza valores mayores
  w_max: 0.80    # [reto] rad/s. El cargador rechaza valores mayores

ejecutor:
  periodo_s: 0.05            # [propio] el temporizador llama a paso() cada 50 ms (20 Hz)
  pausa_s: 0.30              # [medir]  ceros entre el giro y el avance, para que el giro termine de asentarse
  asentamiento_s: 0.50       # [medir]  ceros tras avanzar. /odom llega con 0.5-0.65 s de retardo: probablemente poco
  max_hueco_s: 0.25          # [propio] más tiempo que esto entre dos paso() = temporizador caído, se aborta
  t_max_tramo_s: 60.0        # [propio] un tramo no puede durar más
  a_lin_max: null            # [propio] m/s^2 de rampa al acelerar; null = sin rampa (nunca limita el frenado)
  a_ang_max: null            # [propio] rad/s^2; null = sin rampa
  ajustar_ultimo_paso: true  # [propio] el último paso de cada segmento se escala para que lo comandado sea exacto
  ceros_al_abortar: 5        # [propio] ceros repetidos tras una parada, por si se pierde alguno
